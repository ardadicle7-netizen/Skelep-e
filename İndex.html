<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Nexus & Asistan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between">

    <!-- Navbar -->
    <header class="border-b border-slate-800 bg-slate-900/50 backdrop-blur-md sticky top-0 z-50 px-6 py-4 flex justify-between items-center">
        <div class="flex items-center space-x-3">
            <div class="bg-indigo-600 p-2 rounded-xl text-white shadow-lg shadow-indigo-500/30">
                <i class="fa-solid fa-brain text-xl"></i>
            </div>
            <span class="text-xl font-bold tracking-wide bg-gradient-to-r from-indigo-400 to-cyan-400 bg-clip-text text-transparent">AI Nexus</span>
        </div>
        <div id="user-info" class="hidden flex items-center space-x-4">
            <span id="welcome-text" class="text-sm text-slate-300 font-medium"></span>
            <button onclick="logout()" class="text-xs bg-red-500/10 text-red-400 border border-red-500/20 px-3 py-1.5 rounded-lg hover:bg-red-500/20 transition">Çıkış Yap</button>
        </div>
    </header>

    <!-- Main Container -->
    <main class="flex-1 max-w-4xl w-full mx-auto p-4 md:p-6 flex flex-col justify-center">

        <!-- Kayıt Ekranı -->
        <div id="auth-container" class="max-w-md w-full mx-auto bg-slate-900 border border-slate-800 p-8 rounded-2xl shadow-2xl">
            <h2 class="text-2xl font-bold mb-2 text-center">Hoş Geldiniz</h2>
            <p class="text-slate-400 text-sm text-center mb-6">Yapay zeka asistanına erişmek için kayıt olun.</p>
            
            <form id="register-form" onsubmit="handleRegister(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1 uppercase tracking-wider">Adınız</label>
                    <input type="text" id="reg-name" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-indigo-500 transition">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1 uppercase tracking-wider">E-posta</label>
                    <input type="email" id="reg-email" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-indigo-500 transition">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1 uppercase tracking-wider">Şifre</label>
                    <input type="password" id="reg-password" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-indigo-500 transition">
                </div>
                <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-3 rounded-xl transition shadow-lg shadow-indigo-600/20">Kayıt Ol ve Başla</button>
            </form>
            <p id="auth-msg" class="text-center text-xs mt-4 text-red-400"></p>
        </div>

        <!-- Chat Ekranı -->
        <div id="chat-container" class="hidden flex flex-col h-[75vh] bg-slate-900 border border-slate-800 rounded-2xl shadow-2xl overflow-hidden">
            <div id="chat-messages" class="flex-1 overflow-y-auto p-4 space-y-4">
                <div class="flex items-start space-x-3">
                    <div class="bg-indigo-600 text-white rounded-full h-8 w-8 flex items-center justify-center flex-shrink-0 text-sm"><i class="fa-solid fa-robot"></i></div>
                    <div class="bg-slate-800 border border-slate-700/50 p-4 rounded-2xl max-w-[80%] text-sm leading-relaxed">
                        Merhaba! Ben yapay zeka asistanın. Sana bugün nasıl yardımcı olabilirim?
                    </div>
                </div>
            </div>

            <form id="chat-form" onsubmit="handleChat(event)" class="border-t border-slate-800 p-4 bg-slate-900/80 flex items-center space-x-2">
                <input type="text" id="chat-input" placeholder="Bir şeyler sorun..." required class="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-indigo-500 transition">
                <button type="submit" class="bg-indigo-600 hover:bg-indigo-500 text-white px-5 py-3 rounded-xl transition shadow-lg shadow-indigo-600/20 flex items-center justify-center">
                    <i class="fa-solid fa-paper-plane"></i>
                </button>
            </form>
        </div>

    </main>

    <!-- Footer -->
    <footer class="text-center py-4 text-xs text-slate-500 border-t border-slate-900">
        &copy; 2026 AI Nexus Platform. Tüm hakları saklıdır.
    </footer>

    <script>
        window.onload = function() {
            const savedUser = localStorage.getItem('nexus_user');
            if (savedUser) {
                showChatUI(JSON.parse(savedUser).name);
            }
        }

        async function handleRegister(e) {
            e.preventDefault();
            const name = document.getElementById('reg-name').value;
            const email = document.getElementById('reg-email').value;
            const password = document.getElementById('reg-password').value;
            const msgEl = document.getElementById('auth-msg');

            try {
                const res = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, password })
                });
                const data = await res.json();
                
                if (data.success) {
                    localStorage.setItem('nexus_user', JSON.stringify(data.user));
                    showChatUI(data.user.name);
                } else {
                    msgEl.innerText = data.message || "Kayıt başarısız.";
                }
            } catch (err) {
                msgEl.innerText = "Sunucu bağlantı hatası oluştu.";
            }
        }

        function showChatUI(name) {
            document.getElementById('auth-container').classList.add('hidden');
            document.getElementById('chat-container').classList.remove('hidden');
            document.getElementById('user-info').classList.remove('hidden');
            document.getElementById('welcome-text').innerText = `Merhaba, ${name}`;
        }

        function logout() {
            localStorage.removeItem('nexus_user');
            location.reload();
        }

        async function handleChat(e) {
            e.preventDefault();
            const inputEl = document.getElementById('chat-input');
            const messagesEl = document.getElementById('chat-messages');
            const prompt = inputEl.value.trim();
            if (!prompt) return;

            messagesEl.innerHTML += `
                <div class="flex items-start justify-end space-x-3">
                    <div class="bg-indigo-600/20 border border-indigo-500/30 p-4 rounded-2xl max-w-[80%] text-sm leading-relaxed text-indigo-200">
                        ${prompt}
                    </div>
                    <div class="bg-slate-700 text-white rounded-full h-8 w-8 flex items-center justify-center flex-shrink-0 text-sm"><i class="fa-solid fa-user"></i></div>
                </div>
            `;
            inputEl.value = '';
            messagesEl.scrollTop = messagesEl.scrollHeight;

            const loadingId = 'loading-' + Date.now();
            messagesEl.innerHTML += `
                <div id="${loadingId}" class="flex items-start space-x-3">
                    <div class="bg-indigo-600 text-white rounded-full h-8 w-8 flex items-center justify-center flex-shrink-0 text-sm"><i class="fa-solid fa-robot"></i></div>
                    <div class="bg-slate-800 border border-slate-700/50 p-4 rounded-2xl text-sm text-slate-400 italic">Yapay zeka düşünüyor...</div>
                </div>
            `;
            messagesEl.scrollTop = messagesEl.scrollHeight;

            try {
                const res = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt })
                });
                const data = await res.json();
                
                document.getElementById(loadingId).remove();

                if (data.success) {
                    messagesEl.innerHTML += `
                        <div class="flex items-start space-x-3">
                            <div class="bg-indigo-600 text-white rounded-full h-8 w-8 flex items-center justify-center flex-shrink-0 text-sm"><i class="fa-solid fa-robot"></i></div>
                            <div class="bg-slate-800 border border-slate-700/50 p-4 rounded-2xl max-w-[80%] text-sm leading-relaxed text-slate-200">
                                ${data.reply}
                            </div>
                        </div>
                    `;
                } else {
                    messagesEl.innerHTML += `<div class="text-red-400 text-xs text-center">Hata: ${data.message}</div>`;
                }
            } catch (err) {
                document.getElementById(loadingId).remove();
                messagesEl.innerHTML += `<div class="text-red-400 text-xs text-center">Bağlantı hatası oluştu.</div>`;
            }
            messagesEl.scrollTop = messagesEl.scrollHeight;
        }
    </script>
</body>
  </html>
